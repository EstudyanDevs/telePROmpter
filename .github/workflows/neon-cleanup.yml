name: Clean up stale Neon CI branches

on:
  schedule:
    - cron: '17 */6 * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: neon-ci-cleanup
  cancel-in-progress: false

jobs:
  cleanup:
    if: vars.NEON_PROJECT_ID != '' && vars.NEON_CI_PARENT_ID != ''
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Delete CI-owned branches older than 24 hours
        env:
          NEON_API_KEY: ${{ secrets.NEON_API_KEY }}
          NEON_PROJECT_ID: ${{ vars.NEON_PROJECT_ID }}
          NEON_CI_PARENT_ID: ${{ vars.NEON_CI_PARENT_ID }}
        run: node .github/scripts/neon-ci-database.mjs cleanup
